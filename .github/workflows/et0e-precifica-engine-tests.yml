name: Ever.Precifica Engine Tests

on:
  push:
    branches:
      - main
      - feat/et-0e-ever-precifica
    paths:
      - "ferramentas/precifica/**"
      - "tests/ever-precifica-engine.test.mjs"
      - ".github/workflows/et0e-precifica-engine-tests.yml"
  pull_request:
    paths:
      - "ferramentas/precifica/**"
      - "tests/ever-precifica-engine.test.mjs"
      - ".github/workflows/et0e-precifica-engine-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run deterministic pricing engine tests
        run: node --test tests/ever-precifica-engine.test.mjs
