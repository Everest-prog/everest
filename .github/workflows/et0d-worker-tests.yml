name: Ever.Tools Worker Tests

on:
  push:
    branches:
      - main
    paths:
      - "automation-worker/**"
      - ".github/workflows/et0d-worker-tests.yml"
  pull_request:
    paths:
      - "automation-worker/**"
      - ".github/workflows/et0d-worker-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run unit tests
        run: npm test
